[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-qec"
version = "1.1.0"
description = "Hardened 20-qubit toroidal Wen-plaquette feed-forward preparation pass, exact 256-branch verifier, 16/16 fault-taxonomy suite, RFC 8785 ledger, and provenance-locked Quantinuum H2 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Devin Phillip Davis", email = "354534380+quantum-osiris@users.noreply.github.com" }
]
dependencies = [
  "pytket>=2.18.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
quantinuum = [
  "pytket-quantinuum==0.59.3",
  "qnexus==0.51.4",
]
verification = [
  "pytket-qiskit>=0.79.0",
  "qiskit>=2.6.0",
  "qiskit-aer>=0.18.0",
  "pytest>=9.0.0",
  "matplotlib>=3.10.0",
]

[project.scripts]
osiris = "osiris_cli.qec_runner:main"

[tool.setuptools]
packages = ["osiris_qec", "osiris_cli", "hardware"]
py-modules = [
  "wen_plaquette_pass",
  "dnalang_wen_plaquette_pass",
  "qec_math",
  "qec_sim",
  "qec_verify",
  "audit_baseline",
  "logical_validation",
  "verify_independent",
]
